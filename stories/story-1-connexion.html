<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Story 1 - Connexion</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Gloria+Hallelujah&family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  .story {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
  }

  /* Photo de fond plein ecran */
  .bg-photo {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: url('../images/lifestyle-rose.png') center center / cover no-repeat;
    z-index: 0;
  }

  /* Overlay pour lisibilite */
  .bg-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(245, 240, 235, 0.55) 0%,
      rgba(245, 240, 235, 0.40) 30%,
      rgba(245, 240, 235, 0.30) 50%,
      rgba(245, 240, 235, 0.60) 75%,
      rgba(245, 240, 235, 0.85) 100%
    );
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 100px 65px 60px;
  }

  /* Handle en haut style IG */
  .handle {
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 500;
    color: rgba(30, 30, 30, 0.6);
    letter-spacing: 0.3px;
    margin-bottom: 80px;
  }

  /* Annotation manuscrite haut */
  .handwritten-top {
    font-family: 'Gloria Hallelujah', cursive;
    font-size: 38px;
    color: #E91E8C;
    transform: rotate(-3deg);
    margin-bottom: 20px;
    margin-left: 10px;
  }

  /* Titre principal */
  .main-title {
    font-family: 'Playfair Display', serif;
    font-size: 76px;
    font-weight: 900;
    color: #1a1a1a;
    line-height: 1.12;
    margin-bottom: 40px;
  }
  .main-title .rose {
    color: #E91E8C;
    font-style: italic;
  }

  /* Sous-titre */
  .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 34px;
    color: #444;
    line-height: 1.5;
    margin-bottom: 50px;
  }
  .subtitle strong {
    color: #1a1a1a;
  }

  /* Note scotchee scrapbook */
  .scrapbook-note {
    background: rgba(255, 253, 245, 0.92);
    padding: 35px 40px;
    position: relative;
    transform: rotate(-1.5deg);
    margin-top: auto;
    margin-bottom: 80px;
    box-shadow: 2px 4px 15px rgba(0,0,0,0.06);
  }

  .scrapbook-note p {
    font-family: 'Gloria Hallelujah', cursive;
    font-size: 36px;
    color: #333;
    line-height: 1.5;
  }
  .scrapbook-note .rose {
    color: #E91E8C;
  }

  /* Scotch tape en haut de la note */
  .tape {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%) rotate(1deg);
    width: 140px;
    height: 32px;
    background: rgba(235, 225, 200, 0.65);
    border: 1px solid rgba(210, 195, 170, 0.3);
    backdrop-filter: blur(2px);
  }

  /* Trombone sur la note */
  .paperclip {
    position: absolute;
    top: -25px;
    right: 30px;
    width: 40px;
    height: 85px;
    z-index: 3;
  }
  .paperclip-inner {
    width: 32px;
    height: 75px;
    border: 3px solid #c4a882;
    border-radius: 16px;
    position: relative;
  }
  .paperclip-inner::after {
    content: '';
    position: absolute;
    top: 12px;
    left: 5px;
    width: 18px;
    height: 50px;
    border: 3px solid #c4a882;
    border-radius: 10px;
  }

  /* Doodle etoiles manuscrites */
  .doodle-stars {
    position: absolute;
    top: 380px;
    right: 55px;
    font-family: 'Gloria Hallelujah', cursive;
    font-size: 32px;
    color: #E91E8C;
    opacity: 0.5;
    transform: rotate(12deg);
  }

  /* Doodle fleche */
  .doodle-arrow {
    position: absolute;
    bottom: 260px;
    right: 70px;
    transform: rotate(-10deg);
    opacity: 0.4;
  }

  /* Doodle petit coeur */
  .doodle-heart {
    position: absolute;
    top: 520px;
    left: 55px;
    font-family: 'Gloria Hallelujah', cursive;
    font-size: 28px;
    color: #E91E8C;
    opacity: 0.35;
    transform: rotate(-20deg);
  }

  /* Doodle cercle */
  .doodle-circle {
    position: absolute;
    bottom: 180px;
    left: 60px;
    width: 45px;
    height: 45px;
    border: 2.5px solid #E91E8C;
    border-radius: 50%;
    opacity: 0.2;
  }

  /* Doodle traits */
  .doodle-lines {
    position: absolute;
    top: 300px;
    left: 55px;
    opacity: 0.2;
  }

  /* Epingle en haut a droite */
  .pin {
    position: absolute;
    top: 85px;
    right: 65px;
    z-index: 3;
  }
  .pin-circle {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #E91E8C;
    box-shadow: 0 2px 6px rgba(233, 30, 140, 0.3);
    position: relative;
  }
  .pin-circle::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 18px;
    background: linear-gradient(to bottom, #c4a882, #b09878);
  }
</style>
</head>
<body>
<div class="story">

  <!-- Photo lifestyle plein ecran -->
  <div class="bg-photo"></div>
  <div class="bg-overlay"></div>

  <div class="content">

    <!-- Handle -->
    <div class="handle">@davia.aide.les.biz.en.pls</div>

    <!-- Epingle -->
    <div class="pin"><div class="pin-circle"></div></div>

    <!-- Annotation manuscrite -->
    <p class="handwritten-top">honnêtement...</p>

    <!-- Titre principal -->
    <h1 class="main-title">T'as l'impression de <span class="rose">parler dans le vide</span> sur Insta ?</h1>

    <!-- Sous-titre -->
    <p class="subtitle">Genre tu postes, tu postes...<br>et c'est le <strong>silence radio.</strong></p>

    <!-- Doodles eparpilles -->
    <div class="doodle-stars">* * *</div>
    <div class="doodle-heart">&hearts;</div>
    <div class="doodle-circle"></div>
    <svg class="doodle-lines" width="35" height="45" viewBox="0 0 35 45">
      <line x1="5" y1="5" x2="30" y2="5" stroke="#c4a882" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="5" y1="20" x2="25" y2="20" stroke="#c4a882" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="5" y1="35" x2="20" y2="35" stroke="#c4a882" stroke-width="2.5" stroke-linecap="round"/>
    </svg>

    <!-- Fleche vers la note -->
    <svg class="doodle-arrow" width="60" height="80" viewBox="0 0 60 80">
      <path d="M50 5 Q20 20 30 50 Q35 65 25 75" stroke="#E91E8C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M20 68 L25 75 L32 70" stroke="#E91E8C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>

    <!-- Note scrapbook -->
    <div class="scrapbook-note">
      <div class="tape"></div>
      <div class="paperclip">
        <div class="paperclip-inner"></div>
      </div>
      <p>Respire. C'est pas toi le problème.<br>C'est ta <span class="rose">stratégie</span> qu'on va revoir ensemble.</p>
    </div>

  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Story 1</title>
<style>
  /* Polices Instagram Stories :
     Directional = Bebas Neue (condense bold - PAS italique)
     Classic = Inter (sans-serif avec box)
     Elegant = Playfair Display italic (touches) */
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600;700&family=Playfair+Display:ital,wght@1,400;1,700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #1a1a1a;
  }

  .story {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    background: #d4b8a0;
  }

  /* Photo aesthetic en fond */
  .bg-photo {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* Leger overlay pour lisibilite */
  .bg-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0.10) 0%,
      rgba(0,0,0,0) 30%,
      rgba(0,0,0,0) 60%,
      rgba(0,0,0,0.15) 100%
    );
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    padding: 180px 70px 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* ======= TITRE DIRECTIONAL ======= */
  .title-directional {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 155px;
    line-height: 0.92;
    color: #ffffff;
    letter-spacing: 1px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.35);
    margin-bottom: 50px;
  }

  .title-directional .elegant {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    font-size: 140px;
  }

  /* ======= TEXTE CLASSIC AVEC BOX ======= */
  .classic-box {
    display: inline;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 34px;
    color: #1a1a1a;
    background: #ffffff;
    padding: 10px 18px;
    line-height: 2;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .classic-box.dark {
    color: #ffffff;
    background: #1a1a1a;
  }

  .text-wrapper {
    max-width: 750px;
  }

  /* ======= ÉPINGLE A NOURRICE REALISTE ======= */
  .safety-pin {
    position: absolute;
    top: 140px;
    right: 90px;
    width: 140px;
    height: 60px;
    transform: rotate(-18deg);
    filter: drop-shadow(3px 4px 6px rgba(0,0,0,0.3));
    z-index: 3;
  }

  /* ======= DOODLES BLANCS MINIMES ======= */

  /* Petit coeur main levee */
  .doodle-heart {
    position: absolute;
    top: 250px;
    left: 80px;
    width: 50px;
    height: 45px;
    transform: rotate(-10deg);
    z-index: 3;
  }

  /* 3 petits traits */
  .doodle-traits {
    position: absolute;
    top: 340px;
    right: 180px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transform: rotate(-8deg);
    z-index: 3;
  }
  .doodle-traits span {
    width: 35px;
    height: 4px;
    background: #ffffff;
    border-radius: 2px;
  }
  .doodle-traits span:nth-child(2) { width: 45px; }
  .doodle-traits span:nth-child(3) { width: 25px; }

  /* Petite fleche doodle */
  .doodle-arrow {
    position: absolute;
    bottom: 380px;
    right: 100px;
    width: 60px;
    height: 70px;
    transform: rotate(15deg);
    z-index: 3;
  }

</style>
</head>
<body>
<div class="story">

  <!-- Photo aesthetic beige/rose cozy -->
  <img class="bg-photo"
       src="https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=1080&q=80&auto=format&fit=crop"
       alt="" />
  <div class="bg-overlay"></div>

  <div class="content">

    <!-- Epingle a nourrice -->
    <svg class="safety-pin" viewBox="0 0 140 60" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="metalGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f5f5f5"/>
          <stop offset="40%" stop-color="#d0d0d0"/>
          <stop offset="55%" stop-color="#a8a8a8"/>
          <stop offset="100%" stop-color="#707070"/>
        </linearGradient>
      </defs>
      <!-- Corps ovale -->
      <path d="M 122 30 Q 122 14 105 14 L 28 14 Q 12 14 12 30 Q 12 46 28 46 L 95 46"
            stroke="url(#metalGrad1)" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- Pointe -->
      <line x1="95" y1="46" x2="115" y2="32" stroke="url(#metalGrad1)" stroke-width="7" stroke-linecap="round"/>
      <!-- Ressort -->
      <circle cx="12" cy="30" r="9" fill="none" stroke="url(#metalGrad1)" stroke-width="3.5"/>
      <!-- Reflet -->
      <ellipse cx="67" cy="17" rx="18" ry="1.5" fill="#ffffff" opacity="0.55"/>
    </svg>

    <!-- Petit coeur -->
    <svg class="doodle-heart" viewBox="0 0 50 45" xmlns="http://www.w3.org/2000/svg">
      <path d="M25 40 C13 31 3 23 3 13 C3 7 7 3 12 3 C17 3 21 6 25 10 C29 6 33 3 38 3 C43 3 47 7 47 13 C47 23 37 31 25 40 Z"
            fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- 3 petits traits -->
    <div class="doodle-traits"><span></span><span></span><span></span></div>

    <!-- Petite fleche -->
    <svg class="doodle-arrow" viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
      <path d="M45 8 Q20 25 30 45 Q35 55 25 62"
            stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M18 55 L25 62 L32 56"
            stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- Titre directional -->
    <h1 class="title-directional">
      T'as l'impression<br>
      de parler<br>
      dans le vide <span class="elegant">?</span>
    </h1>

    <!-- Texte classic avec box -->
    <div class="text-wrapper">
      <span class="classic-box">tu postes, tu postes...</span>
      <br><br>
      <span class="classic-box dark">et c'est silence radio.</span>
    </div>

  </div>
</div>
</body>
</html>
